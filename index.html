<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161b; --surface:#1c1f26; --surface-2:#22262f; --line:#2b303a;
    --text:#eef1f5; --muted:#8a93a3;
    --in:#35c07a; --in-ink:#0c2d1e; --out:#f2a23c; --out-ink:#31220a; --danger:#e5544b;
    --tile:#20242c;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Instrument Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --line:#e1e4ea;
      --text:#191c22; --muted:#5c6572;
      --in:#1f9d5f; --in-ink:#ffffff; --out:#c9781a; --out-ink:#ffffff; --danger:#cf3b32;
      --tile:#ffffff;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161b; --surface:#1c1f26; --surface-2:#22262f; --line:#2b303a;
    --text:#eef1f5; --muted:#8a93a3; --tile:#20242c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button{font-family:inherit; color:inherit; cursor:pointer}
  .wrap{max-width:900px; margin:0 auto; padding:18px 16px 40px}

  /* Header */
  header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:20px}
  .venue{font-weight:700; font-size:19px; letter-spacing:-.01em}
  .date{color:var(--muted); font-size:13px; margin-top:2px}
  .clock{font-family:var(--mono); font-weight:500; font-size:38px; line-height:1;
    font-variant-numeric:tabular-nums; letter-spacing:.01em; text-align:right}
  .clock .sec{color:var(--muted); font-size:24px}

  /* Roster grid */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
  .tile{
    background:var(--tile); border:1px solid var(--line); border-radius:16px;
    padding:16px 15px; text-align:left; min-height:104px; display:flex; flex-direction:column;
    justify-content:space-between; transition:transform .06s ease, border-color .15s ease;
  }
  .tile:active{transform:scale(.975)}
  .tile.on{border-color:color-mix(in srgb, var(--in) 55%, var(--line))}
  .tile .nm{font-weight:600; font-size:17px; line-height:1.2}
  .status{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted)}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none}
  .tile.on .dot{background:var(--in); box-shadow:0 0 0 3px color-mix(in srgb,var(--in) 22%, transparent)}
  .status .dur{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--in); font-weight:500}

  /* Empty state */
  .empty{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px; text-align:center}
  .empty h2{margin:0 0 6px; font-size:19px}
  .empty p{margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.5}

  /* Buttons */
  .btn{border:1px solid var(--line); background:var(--surface-2); border-radius:12px;
    padding:12px 16px; font-size:15px; font-weight:600}
  .btn.primary{background:var(--in); color:var(--in-ink); border-color:transparent}
  .btn.ghost{background:transparent}
  .btn.wide{width:100%}
  .btn.sm{padding:8px 12px; font-size:13px; border-radius:10px}
  .btn.danger{color:var(--danger); border-color:color-mix(in srgb,var(--danger) 40%, var(--line))}
  .rowbtns{display:flex; gap:8px; flex-wrap:wrap}

  .mgr-link{position:fixed; right:14px; bottom:12px; font-size:12.5px; color:var(--muted);
    background:transparent; border:none; padding:8px; text-decoration:underline; text-underline-offset:3px}

  /* Modal / sheet */
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end;
    justify-content:center; z-index:20; padding:0}
  @media(min-width:560px){ .scrim{align-items:center; padding:20px} }
  .sheet{background:var(--surface); border:1px solid var(--line); width:100%; max-width:420px;
    border-radius:22px 22px 0 0; padding:20px 20px 26px}
  @media(min-width:560px){ .sheet{border-radius:20px} }
  .sheet h3{margin:0 0 2px; font-size:18px}
  .sheet .sub{color:var(--muted); font-size:13.5px; margin-bottom:16px}

  /* PIN */
  .dots{display:flex; gap:12px; justify-content:center; margin:6px 0 18px}
  .pd{width:14px; height:14px; border-radius:50%; border:2px solid var(--muted)}
  .pd.f{background:var(--text); border-color:var(--text)}
  .pd.err{border-color:var(--danger); animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .keys{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .key{background:var(--surface-2); border:1px solid var(--line); border-radius:14px;
    height:60px; font-family:var(--mono); font-size:24px; font-weight:500;
    font-variant-numeric:tabular-nums; display:flex; align-items:center; justify-content:center}
  .key:active{background:var(--line)}
  .key.blank{background:transparent; border:none}

  /* Confirmation stamp */
  .stamp{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    animation:pop .18s ease}
  @keyframes pop{from{opacity:0; transform:scale(.97)}to{opacity:1; transform:scale(1)}}
  .stamp.in{background:var(--in); color:var(--in-ink)}
  .stamp.out{background:var(--out); color:var(--out-ink)}
  .stamp .mark{font-size:64px; line-height:1; margin-bottom:10px}
  .stamp .verb{font-size:34px; font-weight:700; letter-spacing:-.02em}
  .stamp .who{font-size:20px; margin-top:4px; opacity:.9}
  .stamp .at{font-family:var(--mono); font-size:44px; font-variant-numeric:tabular-nums;
    margin-top:14px; font-weight:500}
  .stamp .tap{margin-top:26px; font-size:13px; opacity:.75}

  /* Manager */
  .mtop{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px}
  .mtop h2{margin:0; font-size:20px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px}
  .card h4{margin:0 0 12px; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.02em}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{text-align:left; padding:9px 6px; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600; font-size:12.5px}
  td.t{font-family:var(--mono); font-variant-numeric:tabular-nums}
  .pill{font-size:12px; padding:2px 9px; border-radius:20px; font-weight:600}
  .pill.on{background:color-mix(in srgb,var(--in) 20%, transparent); color:var(--in)}
  .staffrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .staffrow .nm{flex:1; font-weight:600}
  .staffrow .pin{font-family:var(--mono); color:var(--muted); font-size:13px}
  input[type=text],input[type=tel]{
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font:inherit; padding:10px 12px; width:100%; font-size:15px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px}
  .inline{display:flex; gap:8px}
  .inline input{flex:1}
  .muted{color:var(--muted); font-size:13px}
  .empty-log{color:var(--muted); font-size:14px; padding:10px 4px}
  ::placeholder{color:var(--muted); opacity:.7}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="mgr-link" id="mgrLink" onclick="openManager()">Manager</button>

<script>
"use strict";
const KEY="staffclock.v1";
const pad=n=>String(n).padStart(2,"0");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- state ---------- */
function load(){
  try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){}
  return {venueName:"My Venue", managerPin:"", staff:[], punches:[]};
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
let S=load();

/* ---------- time helpers ---------- */
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const hm=ts=>{const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes());};
const dayKey=ts=>{const d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
function durTxt(ms){
  const m=Math.floor(ms/60000); const h=Math.floor(m/60);
  return h>0 ? h+"h "+pad(m%60)+"m" : m+"m";
}
function decHours(ms){ return (ms/3600000).toFixed(2); }

/* status of a staff member = type of their most recent punch */
function lastPunch(staffId){
  let last=null;
  for(const p of S.punches){ if(p.staffId===staffId && (!last||p.ts>last.ts)) last=p; }
  return last;
}

/* ---------- screen router ---------- */
let screen="roster";       // roster | manager
let sheet=null;            // {kind:'pin', staff, next} | {kind:'setpin'} etc.
let stamp=null;            // {type, name, ts}

function render(){
  const app=document.getElementById("app");
  if(stamp){ renderStamp(); }
  document.getElementById("mgrLink").style.display = (screen==="roster") ? "block" : "none";
  if(screen==="roster") app.innerHTML=rosterHTML();
  else app.innerHTML=managerHTML();
  renderSheet();
}

/* ---------- ROSTER ---------- */
function rosterHTML(){
  const now=new Date();
  const head=`<header>
    <div><div class="venue">${esc(S.venueName)}</div>
    <div class="date">${DAYS[now.getDay()]} ${now.getDate()} ${MONS[now.getMonth()]}</div></div>
    <div class="clock" id="clk">${clockStr()}</div></header>`;

  if(S.staff.length===0){
    return head+`<div class="empty">
      <h2>No one on the roster yet</h2>
      <p>Add your team in the Manager area, then staff tap their name to clock in and out.</p>
      <div class="rowbtns" style="justify-content:center">
        <button class="btn primary" onclick="openManager()">Open Manager</button>
        <button class="btn ghost" onclick="seedSample()">Add sample staff</button>
      </div></div>`;
  }
  const tiles=[...S.staff].sort((a,b)=>a.order-b.order).map(st=>{
    const lp=lastPunch(st.id);
    const on = lp && lp.type==="in";
    const status = on
      ? `<span class="dot"></span><span>On shift</span><span class="dur" data-since="${lp.ts}">${durTxt(Date.now()-lp.ts)}</span>`
      : `<span class="dot"></span><span>Off</span>`;
    return `<button class="tile ${on?'on':''}" onclick="tapStaff('${st.id}')">
      <div class="nm">${esc(st.name)}</div>
      <div class="status">${status}</div></button>`;
  }).join("");
  return head+`<div class="grid">${tiles}</div>`;
}
function clockStr(){
  const d=new Date();
  return pad(d.getHours())+":"+pad(d.getMinutes())+`<span class="sec">:${pad(d.getSeconds())}</span>`;
}

/* ---------- tap a staff tile ---------- */
function tapStaff(id){
  const st=S.staff.find(s=>s.id===id); if(!st) return;
  const lp=lastPunch(id);
  const next = (lp && lp.type==="in") ? "out" : "in";
  sheet={kind:"pin", staff:st, next, entry:""};
  render();
}

/* punch after correct PIN */
function doPunch(st,type){
  const ts=Date.now();
  S.punches.push({id:uid(), staffId:st.id, name:st.name, type, ts});
  save();
  sheet=null;
  stamp={type, name:st.name, ts};
  render();
  clearTimeout(stamp._t);
  stamp._t=setTimeout(dismissStamp, 3500);
}
function dismissStamp(){ if(stamp){clearTimeout(stamp._t); stamp=null; document.getElementById("stampEl")?.remove(); } }

/* ---------- SHEET (pin pad + dialogs) ---------- */
function renderSheet(){
  document.getElementById("scrim")?.remove();
  if(!sheet) return;
  const s=document.createElement("div"); s.className="scrim"; s.id="scrim";
  s.onclick=e=>{ if(e.target===s) sheet=null, render(); };
  s.innerHTML=`<div class="sheet">${sheetInner()}</div>`;
  document.body.appendChild(s);
}
function sheetInner(){
  if(sheet.kind==="pin"){
    const verb = sheet.next==="in" ? "Clock in" : "Clock out";
    const dots=[0,1,2,3].map(i=>`<div class="pd ${i<sheet.entry.length?'f':''} ${sheet.err?'err':''}"></div>`).join("");
    const keys=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>{
      if(k==="") return `<div class="key blank"></div>`;
      return `<button class="key" onclick="pinKey('${k}')">${k}</button>`;
    }).join("");
    return `<h3>${verb} — ${esc(sheet.staff.name)}</h3>
      <div class="sub">Enter your 4-digit PIN</div>
      <div class="dots">${dots}</div>
      <div class="keys">${keys}</div>`;
  }
  if(sheet.kind==="setmgr"){
    return `<h3>Set a Manager PIN</h3>
      <div class="sub">You'll need this to reach staff settings and reports.</div>
      <div class="field"><input id="mp" type="tel" inputmode="numeric" maxlength="8" placeholder="Choose a PIN"></div>
      <button class="btn primary wide" onclick="saveMgrPin()">Save & continue</button>`;
  }
  if(sheet.kind==="askmgr"){
    return `<h3>Manager PIN</h3>
      <div class="sub">Enter your PIN to continue.</div>
      <div class="field"><input id="mp" type="tel" inputmode="numeric" maxlength="8" placeholder="PIN" ${sheet.err?'style="border-color:var(--danger)"':''}></div>
      <button class="btn primary wide" onclick="checkMgrPin()">Enter</button>`;
  }
  if(sheet.kind==="staff"){
    const ed=sheet.edit;
    return `<h3>${ed?'Edit':'Add'} staff</h3>
      <div class="field"><label>Name</label><input id="sn" type="text" value="${ed?esc(ed.name):''}" placeholder="Full name"></div>
      <div class="field"><label>4-digit PIN</label><input id="sp" type="tel" inputmode="numeric" maxlength="4" value="${ed?esc(ed.pin):''}" placeholder="e.g. 1234"></div>
      <div class="rowbtns"><button class="btn primary" onclick="saveStaff()">Save</button>
      <button class="btn ghost" onclick="sheet=null;render()">Cancel</button>
      ${ed?`<button class="btn danger" style="margin-left:auto" onclick="removeStaff('${ed.id}')">Remove</button>`:''}</div>`;
  }
  return "";
}

/* PIN pad input */
function pinKey(k){
  if(!sheet||sheet.kind!=="pin") return;
  sheet.err=false;
  if(k==="⌫"){ sheet.entry=sheet.entry.slice(0,-1); render(); return; }
  if(sheet.entry.length>=4) return;
  sheet.entry+=k;
  if(sheet.entry.length===4){
    if(sheet.entry===sheet.staff.pin){ doPunch(sheet.staff, sheet.next); }
    else { sheet.err=true; sheet.entry=""; render();
           setTimeout(()=>{ if(sheet){sheet.err=false; render();} },350); return; }
  }
  render();
}

/* ---------- STAMP ---------- */
function renderStamp(){
  document.getElementById("stampEl")?.remove();
  const el=document.createElement("div");
  el.id="stampEl"; el.className="stamp "+stamp.type;
  el.onclick=dismissStamp;
  el.innerHTML=`<div class="mark">${stamp.type==="in"?"✓":"✕"}</div>
    <div class="verb">${stamp.type==="in"?"Clocked in":"Clocked out"}</div>
    <div class="who">${esc(stamp.name)}</div>
    <div class="at">${hm(stamp.ts)}</div>
    <div class="tap">Tap to close</div>`;
  document.body.appendChild(el);
}

/* ---------- MANAGER ---------- */
function openManager(){
  if(!S.managerPin){ sheet={kind:"setmgr"}; render(); return; }
  sheet={kind:"askmgr"}; render();
}
function saveMgrPin(){
  const v=(document.getElementById("mp").value||"").trim();
  if(v.length<4){ alert("Use at least 4 digits."); return; }
  S.managerPin=v; save(); sheet=null; screen="manager"; render();
}
function checkMgrPin(){
  const v=(document.getElementById("mp").value||"").trim();
  if(v===S.managerPin){ sheet=null; screen="manager"; render(); }
  else { sheet.err=true; render(); }
}
function exitManager(){ screen="roster"; sheet=null; render(); }

function managerHTML(){
  return `<div class="mtop"><h2>Manager</h2>
    <button class="btn ghost sm" onclick="exitManager()">Back to clock</button></div>
    ${onShiftCard()}${todayCard()}${staffCard()}${exportCard()}${settingsCard()}`;
}
function onShiftCard(){
  const on=S.staff.filter(st=>{const lp=lastPunch(st.id); return lp&&lp.type==="in";});
  const rows = on.length? on.map(st=>{
    const lp=lastPunch(st.id);
    return `<tr><td>${esc(st.name)}</td><td class="t">${hm(lp.ts)}</td>
      <td class="t">${durTxt(Date.now()-lp.ts)}</td><td><span class="pill on">on shift</span></td></tr>`;
  }).join("") : `<tr><td colspan="4" class="empty-log">No one is clocked in right now.</td></tr>`;
  return `<div class="card"><h4>On shift now</h4>
    <table><thead><tr><th>Name</th><th>Since</th><th>Elapsed</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function todayCard(){
  const today=dayKey(Date.now());
  const sessions=buildSessions(p=>dayKey(p.ts)===today);
  const rows = sessions.length? sessions.map(s=>`<tr>
      <td>${esc(s.name)}</td><td class="t">${hm(s.in)}</td>
      <td class="t">${s.out?hm(s.out):'—'}</td>
      <td class="t">${s.out?durTxt(s.out-s.in):'<span class="pill on">now</span>'}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty-log">No clock-ins today yet.</td></tr>`;
  return `<div class="card"><h4>Today's log</h4>
    <table><thead><tr><th>Name</th><th>In</th><th>Out</th><th>Hours</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function staffCard(){
  const rows=[...S.staff].sort((a,b)=>a.order-b.order).map(st=>`
    <div class="staffrow"><span class="nm">${esc(st.name)}</span>
      <span class="pin">PIN ${esc(st.pin)}</span>
      <button class="btn ghost sm" onclick="editStaff('${st.id}')">Edit</button></div>`).join("");
  return `<div class="card"><h4>Staff & PINs</h4>
    ${rows||'<div class="empty-log">No staff yet.</div>'}
    <div style="margin-top:12px"><button class="btn sm" onclick="addStaff()">+ Add staff</button></div></div>`;
}
function exportCard(){
  return `<div class="card"><h4>Export</h4>
    <p class="muted" style="margin:0 0 12px">Download a CSV of clock-in sessions for your records or payroll.</p>
    <div class="rowbtns">
      <button class="btn sm" onclick="exportCSV('today')">Today</button>
      <button class="btn sm" onclick="exportCSV('week')">Last 7 days</button>
      <button class="btn sm" onclick="exportCSV('all')">All records</button>
    </div>
    <div style="margin-top:14px"><button class="btn ghost sm danger" onclick="clearOld()">Clear records older than 60 days</button></div>
  </div>`;
}
function settingsCard(){
  return `<div class="card"><h4>Settings</h4>
    <div class="field"><label>Venue name</label>
      <div class="inline"><input id="vn" type="text" value="${esc(S.venueName)}">
      <button class="btn sm" onclick="saveVenue()">Save</button></div></div>
    <div class="field"><label>Manager PIN</label>
      <div class="inline"><input id="mpn" type="tel" inputmode="numeric" maxlength="8" value="${esc(S.managerPin)}">
      <button class="btn sm" onclick="saveMgrPin2()">Update</button></div></div>
    <p class="muted">Data is stored on this device only. Use Export regularly as your backup.</p>
  </div>`;
}

/* build in/out sessions from punches (paired per staff per day) */
function buildSessions(filter){
  const ps=S.punches.filter(filter).slice().sort((a,b)=>a.ts-b.ts);
  const openBy={}; const out=[];
  for(const p of ps){
    if(p.type==="in"){ openBy[p.staffId]={name:p.name,in:p.ts}; }
    else { const o=openBy[p.staffId];
      if(o){ out.push({name:o.name,in:o.in,out:p.ts}); delete openBy[p.staffId]; }
      else { out.push({name:p.name,in:null,out:p.ts}); } }
  }
  for(const k in openBy) out.push({name:openBy[k].name,in:openBy[k].in,out:null});
  return out.sort((a,b)=>(a.in||a.out)-(b.in||b.out));
}

/* staff CRUD */
function addStaff(){ sheet={kind:"staff",edit:null}; render(); }
function editStaff(id){ sheet={kind:"staff",edit:S.staff.find(s=>s.id===id)}; render(); }
function saveStaff(){
  const name=(document.getElementById("sn").value||"").trim();
  const pin=(document.getElementById("sp").value||"").trim();
  if(!name){ alert("Enter a name."); return; }
  if(!/^\d{4}$/.test(pin)){ alert("PIN must be 4 digits."); return; }
  if(sheet.edit){ sheet.edit.name=name; sheet.edit.pin=pin; }
  else { S.staff.push({id:uid(),name,pin,order:S.staff.length}); }
  save(); sheet=null; render();
}
function removeStaff(id){
  if(!confirm("Remove this staff member? Their past records stay in exports.")) return;
  S.staff=S.staff.filter(s=>s.id!==id); save(); sheet=null; render();
}
function seedSample(){
  const names=["Maria Santos","Jordan Lee","Amir Haddad","Chloe Nguyen"];
  names.forEach((n,i)=>S.staff.push({id:uid(),name:n,pin:String(1111*(i+1)).slice(0,4),order:i}));
  save(); render();
}

/* settings */
function saveVenue(){ S.venueName=(document.getElementById("vn").value||"My Venue").trim()||"My Venue"; save(); render(); }
function saveMgrPin2(){ const v=(document.getElementById("mpn").value||"").trim();
  if(v.length<4){alert("Use at least 4 digits.");return;} S.managerPin=v; save(); alert("Manager PIN updated."); }
function clearOld(){
  const cut=Date.now()-60*864e5;
  const before=S.punches.length;
  S.punches=S.punches.filter(p=>p.ts>=cut); save();
  alert("Removed "+(before-S.punches.length)+" old record(s)."); render();
}

/* CSV export */
function exportCSV(range){
  let filter=()=>true;
  if(range==="today"){ const t=dayKey(Date.now()); filter=p=>dayKey(p.ts)===t; }
  if(range==="week"){ const cut=Date.now()-7*864e5; filter=p=>p.ts>=cut; }
  const sessions=buildSessions(filter);
  if(!sessions.length){ alert("No records in that range."); return; }
  const rows=[["Date","Staff","Clock in","Clock out","Hours"]];
  for(const s of sessions){
    const base=s.in||s.out;
    rows.push([dayKey(base), s.name, s.in?hm(s.in):"", s.out?hm(s.out):"",
      (s.in&&s.out)?decHours(s.out-s.in):""]);
  }
  const csv=rows.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c).join(",")).join("\r\n");
  const fname=(S.venueName.replace(/[^\w -]/g,"").trim()||"venue")+"-timesheet-"+dayKey(Date.now())+".csv";
  saveFile(fname, csv);
}
async function saveFile(filename, text){
  try{
    const dl = window.claude && await claude.use("downloads");
    if(dl){ await dl.save({filename, data:text}); return; }
  }catch(e){ if(e && e.code==="declined") return; }
  // fallback for non-published / preview contexts
  try{
    const b=new Blob([text],{type:"text/csv"}); const u=URL.createObjectURL(b);
    const a=document.createElement("a"); a.href=u; a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
  }catch(e){ alert("Could not start the download here."); }
}

/* ---------- misc ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

render();
