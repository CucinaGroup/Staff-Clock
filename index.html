<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161b; --surface:#1c1f26; --surface-2:#22262f; --line:#2b303a;
    --text:#eef1f5; --muted:#8a93a3;
    --in:#35c07a; --in-ink:#0c2d1e; --out:#f2a23c; --out-ink:#31220a; --danger:#e5544b;
    --tile:#20242c;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Instrument Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8; --line:#e1e4ea;
      --text:#191c22; --muted:#5c6572;
      --in:#1f9d5f; --in-ink:#ffffff; --out:#c9781a; --out-ink:#ffffff; --danger:#cf3b32; --tile:#ffffff;
    }
  }
  :root[data-theme="dark"]{ --bg:#14161b; --surface:#1c1f26; --surface-2:#22262f; --line:#2b303a; --text:#eef1f5; --muted:#8a93a3; --tile:#20242c; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;
    overflow-x:hidden; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  button{font-family:inherit; color:inherit; cursor:pointer}
  a{color:var(--in)}
  .wrap{max-width:900px; margin:0 auto; padding:18px 16px 40px}

  header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:20px}
  .venue{font-weight:700; font-size:19px; letter-spacing:-.01em}
  .date{color:var(--muted); font-size:13px; margin-top:2px}
  .clock{font-family:var(--mono); font-weight:500; font-size:38px; line-height:1; font-variant-numeric:tabular-nums; text-align:right}
  .clock .sec{color:var(--muted); font-size:24px}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
  .tile{background:var(--tile); border:1px solid var(--line); border-radius:16px; padding:16px 15px; text-align:left;
    min-height:104px; display:flex; flex-direction:column; justify-content:space-between; transition:transform .06s ease, border-color .15s ease;}
  .tile:active{transform:scale(.975)}
  .tile.on{border-color:color-mix(in srgb, var(--in) 55%, var(--line))}
  .tile .nm{font-weight:600; font-size:17px; line-height:1.2}
  .status{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted)}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none}
  .tile.on .dot{background:var(--in); box-shadow:0 0 0 3px color-mix(in srgb,var(--in) 22%, transparent)}
  .status .dur{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--in); font-weight:500}

  .empty{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px; text-align:center}
  .empty h2{margin:0 0 6px; font-size:19px}
  .empty p{margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.55}
  .empty code{font-family:var(--mono); font-size:12.5px; background:var(--surface-2); padding:2px 6px; border-radius:6px}

  .btn{border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:12px 16px; font-size:15px; font-weight:600}
  .btn.primary{background:var(--in); color:var(--in-ink); border-color:transparent}
  .btn.ghost{background:transparent}
  .btn.wide{width:100%}
  .btn.sm{padding:8px 12px; font-size:13px; border-radius:10px}
  .btn.danger{color:var(--danger); border-color:color-mix(in srgb,var(--danger) 40%, var(--line))}
  .rowbtns{display:flex; gap:8px; flex-wrap:wrap}

  .mgr-link{position:fixed; right:14px; bottom:12px; font-size:12.5px; color:var(--muted); background:transparent; border:none; padding:8px; text-decoration:underline; text-underline-offset:3px}

  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:20; padding:0}
  @media(min-width:560px){ .scrim{align-items:center; padding:20px} }
  .sheet{background:var(--surface); border:1px solid var(--line); width:100%; max-width:420px; border-radius:22px 22px 0 0; padding:20px 20px 26px}
  @media(min-width:560px){ .sheet{border-radius:20px} }
  .sheet h3{margin:0 0 2px; font-size:18px}
  .sheet .sub{color:var(--muted); font-size:13.5px; margin-bottom:16px}

  .dots{display:flex; gap:12px; justify-content:center; margin:6px 0 18px}
  .pd{width:14px; height:14px; border-radius:50%; border:2px solid var(--muted)}
  .pd.f{background:var(--text); border-color:var(--text)}
  .pd.err{border-color:var(--danger); animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .keys{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .key{background:var(--surface-2); border:1px solid var(--line); border-radius:14px; height:60px; font-family:var(--mono);
    font-size:24px; font-weight:500; font-variant-numeric:tabular-nums; display:flex; align-items:center; justify-content:center}
  .key:active{background:var(--line)}
  .key.blank{background:transparent; border:none}

  /* Camera */
  .camov{position:fixed; inset:0; z-index:45; background:#000; display:flex; align-items:center; justify-content:center}
  .camov video{width:100%; height:100%; object-fit:cover}
  .camov video.mirror{transform:scaleX(-1)}
  .camtop{position:absolute; left:0; right:0; top:7%; text-align:center; color:#fff; font-size:19px; font-weight:600; text-shadow:0 1px 8px rgba(0,0,0,.8); padding:0 20px}
  .cambar{position:absolute; left:0; right:0; bottom:6%; display:flex; align-items:center; justify-content:space-between; padding:0 26px}
  .shutter{width:74px; height:74px; border-radius:50%; background:#fff; border:5px solid rgba(255,255,255,.5); box-shadow:0 0 0 2px rgba(0,0,0,.3)}
  .shutter:active{transform:scale(.94)}
  .shutter:disabled{opacity:.4}
  .cambtn{background:rgba(0,0,0,.45); color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:12px; padding:10px 14px; font-weight:600; width:70px}
  .camspacer{width:70px}

  .stamp{position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; animation:pop .18s ease}
  @keyframes pop{from{opacity:0; transform:scale(.97)}to{opacity:1; transform:scale(1)}}
  .stamp.in{background:var(--in); color:var(--in-ink)}
  .stamp.out{background:var(--out); color:var(--out-ink)}
  .stamp .mark{font-size:64px; line-height:1; margin-bottom:10px}
  .stamp .verb{font-size:34px; font-weight:700; letter-spacing:-.02em}
  .stamp .who{font-size:20px; margin-top:4px; opacity:.9}
  .stamp .at{font-family:var(--mono); font-size:44px; font-variant-numeric:tabular-nums; margin-top:14px; font-weight:500}
  .stamp .tap{margin-top:26px; font-size:13px; opacity:.75}

  .mtop{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px}
  .mtop h2{margin:0; font-size:20px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px}
  .card h4{margin:0 0 12px; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.02em; display:flex; justify-content:space-between; align-items:center}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); vertical-align:top}
  th{color:var(--muted); font-weight:600; font-size:12.5px}
  td.t{font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
  .pblock{display:flex; align-items:center; gap:6px; margin-top:5px; flex-wrap:wrap}
  .thumb{width:38px; height:38px; object-fit:cover; border-radius:7px; border:1px solid var(--line); cursor:pointer; flex:none}
  .cap{font-size:11px; color:var(--muted); line-height:1.2}
  .pill{font-size:12px; padding:2px 9px; border-radius:20px; font-weight:600}
  .pill.on{background:color-mix(in srgb,var(--in) 20%, transparent); color:var(--in)}
  .pill.off{background:color-mix(in srgb,var(--danger) 18%, transparent); color:var(--danger)}
  .pill.warn{background:color-mix(in srgb,var(--out) 22%, transparent); color:var(--out)}
  .staffrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .staffrow .nm{flex:1; font-weight:600}
  .staffrow .pin{font-family:var(--mono); color:var(--muted); font-size:13px}
  input[type=text],input[type=tel]{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; color:var(--text); font:inherit; padding:10px 12px; width:100%; font-size:15px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px}
  .inline{display:flex; gap:8px}
  .inline input{flex:1}
  .togglerow{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .muted{color:var(--muted); font-size:13px}
  .empty-log{color:var(--muted); font-size:14px; padding:10px 4px}
  ::placeholder{color:var(--muted); opacity:.7}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="mgr-link" id="mgrLink" style="display:none" onclick="openManager()">Manager</button>

<script>
"use strict";

// ============================================================
//  SETTINGS — paste your Supabase details between the quotes.
//  Supabase -> Project Settings -> API (or Data API).
//  SUPA_URL is the bare project URL ending in .supabase.co
//  (any /rest/v1 or trailing slash is stripped automatically).
// ============================================================
const SUPA_URL = "https://YOUR-PROJECT.supabase.co";
const SUPA_KEY = "YOUR-ANON-OR-PUBLISHABLE-KEY";
// ============================================================

const BASE = SUPA_URL.replace(/\/+$/,"").replace(/\/rest\/v1$/,"");
const BUCKET = "punch-photos";
const pad=n=>String(n).padStart(2,"0");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function configured(){ return !/YOUR-PROJECT|YOUR-ANON/.test(SUPA_URL+SUPA_KEY); }
function photoUrlFor(path){ return BASE+"/storage/v1/object/public/"+BUCKET+"/"+path; }

/* ---------- Supabase REST helper ---------- */
async function api(path, opts={}){
  const res=await fetch(BASE+"/rest/v1/"+path, {
    ...opts,
    headers:{ apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"application/json", ...(opts.headers||{}) }
  });
  if(!res.ok){ throw new Error("DB "+res.status+": "+(await res.text())); }
  const t=await res.text(); return t?JSON.parse(t):null;
}
async function uploadPhoto(blob){
  const path=uid()+".jpg";
  const res=await fetch(BASE+"/storage/v1/object/"+BUCKET+"/"+path, {
    method:"POST",
    headers:{ apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY, "Content-Type":"image/jpeg" },
    body:blob
  });
  if(!res.ok){ throw new Error("Upload "+res.status+": "+(await res.text())); }
  return path;
}

/* ---------- local cache ---------- */
let S={ venueName:"My Venue", managerPin:"", verify:"location", selfie:true, venue:{lat:null,lng:null,radius:150}, staff:[], punches:[] };
function applySettings(r){
  S.venueName=r?.venue_name||"My Venue"; S.managerPin=r?.manager_pin||""; S.verify=r?.verify||"location";
  S.selfie = r ? r.selfie!==false : true;
  S.venue={lat:r?.venue_lat??null, lng:r?.venue_lng??null, radius:r?.radius||150};
}
function fromRow(r){
  const p={id:r.id, staffId:r.staff_id, name:r.name, type:r.kind, ts:Number(r.ts)};
  if(r.lat!=null){ p.loc={lat:r.lat,lng:r.lng,acc:r.acc}; p.dist=r.dist; }
  if(r.loc_error) p.locError=r.loc_error;
  if(r.photo_path) p.photoUrl=photoUrlFor(r.photo_path);
  return p;
}
async function saveSettings(){
  const row={id:1, venue_name:S.venueName, manager_pin:S.managerPin, verify:S.verify, selfie:S.selfie,
    venue_lat:S.venue.lat, venue_lng:S.venue.lng, radius:S.venue.radius};
  await api("settings",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)});
}

/* ---------- helpers ---------- */
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const hm=ts=>{const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes());};
const dayKey=ts=>{const d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
function durTxt(ms){const m=Math.floor(ms/60000); const h=Math.floor(m/60); return h>0?h+"h "+pad(m%60)+"m":m+"m";}
function decHours(ms){ return (ms/3600000).toFixed(2); }
function lastPunch(id){ let last=null; for(const p of S.punches){ if(p.staffId===id&&(!last||p.ts>last.ts)) last=p; } return last; }
function distM(la1,lo1,la2,lo2){ const R=6371000,tr=x=>x*Math.PI/180; const dLa=tr(la2-la1),dLo=tr(lo2-lo1);
  const s=Math.sin(dLa/2)**2+Math.cos(tr(la1))*Math.cos(tr(la2))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function radius(){ return (S.venue&&S.venue.radius)||150; }
function venueSet(){ return S.venue&&S.venue.lat!=null; }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- boot ---------- */
let screen="roster", sheet=null, stamp=null, mgrTimer=null;
async function init(){
  const app=document.getElementById("app");
  if(!configured()){ app.innerHTML=`<div class="empty"><h2>Almost there — add your Supabase keys</h2>
    <p>Paste your project URL and key into the <code>SETTINGS</code> block near the top of the script, then reload.</p></div>`; return; }
  app.innerHTML=`<div class="empty"><h2>Loading…</h2></div>`;
  try{
    const [st,staff,punches]=await Promise.all([
      api("settings?select=*&id=eq.1"),
      api("staff?select=*&order=sort.asc"),
      api("punches?select=*&ts=gte."+(Date.now()-2*864e5)+"&order=ts.desc")
    ]);
    applySettings(st&&st[0]);
    S.staff=(staff||[]).map(r=>({id:r.id,name:r.name,pin:r.pin,order:r.sort}));
    S.punches=(punches||[]).map(fromRow);
    render();
  }catch(e){ app.innerHTML=`<div class="empty"><h2>Couldn't reach the database</h2>
    <p>${esc(e.message)}</p><button class="btn primary" onclick="init()">Try again</button></div>`; }
}
function render(){
  const app=document.getElementById("app");
  document.getElementById("mgrLink").style.display=(screen==="roster")?"block":"none";
  if(screen==="roster") app.innerHTML=rosterHTML();
  else app.innerHTML=managerHTML();
  renderSheet();
}

/* ---------- ROSTER ---------- */
function rosterHTML(){
  const now=new Date();
  const head=`<header><div><div class="venue">${esc(S.venueName)}</div>
    <div class="date">${DAYS[now.getDay()]} ${now.getDate()} ${MONS[now.getMonth()]}</div></div>
    <div class="clock" id="clk">${clockStr()}</div></header>`;
  if(S.staff.length===0){
    return head+`<div class="empty"><h2>No one on the roster yet</h2>
      <p>Add your team in the Manager area, then staff tap their name to clock in and out.</p>
      <div class="rowbtns" style="justify-content:center">
        <button class="btn primary" onclick="openManager()">Open Manager</button>
        <button class="btn ghost" onclick="seedSample()">Add sample staff</button></div></div>`;
  }
  const tiles=[...S.staff].sort((a,b)=>a.order-b.order).map(st=>{
    const lp=lastPunch(st.id); const on=lp&&lp.type==="in";
    const status=on?`<span class="dot"></span><span>On shift</span><span class="dur" data-since="${lp.ts}">${durTxt(Date.now()-lp.ts)}</span>`:`<span class="dot"></span><span>Off</span>`;
    return `<button class="tile ${on?'on':''}" onclick="tapStaff('${st.id}')"><div class="nm">${esc(st.name)}</div><div class="status">${status}</div></button>`;
  }).join("");
  return head+`<div class="grid">${tiles}</div>`;
}
function clockStr(){const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())+`<span class="sec">:${pad(d.getSeconds())}</span>`;}
function tapStaff(id){ const st=S.staff.find(s=>s.id===id); if(!st)return;
  const lp=lastPunch(id); const next=(lp&&lp.type==="in")?"out":"in";
  sheet={kind:"pin", staff:st, next, entry:""}; render(); }

/* ---------- location ---------- */
function captureLocation(){
  return new Promise(resolve=>{
    let settled=false;
    const ov=document.createElement("div"); ov.className="scrim"; ov.style.alignItems="center"; ov.style.zIndex=46;
    ov.innerHTML=`<div class="sheet" style="max-width:340px;text-align:center">
      <h3>Getting your location…</h3><div class="sub" style="margin:8px 0 16px">Please allow location access when asked.</div>
      <button class="btn ghost wide" id="locCancel">Cancel</button></div>`;
    document.body.appendChild(ov);
    const finish=v=>{ if(settled)return; settled=true; ov.remove(); resolve(v); };
    ov.querySelector("#locCancel").onclick=()=>finish({cancelled:true});
    if(!navigator.geolocation){ finish({error:"unavailable"}); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>finish({lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy}),
      err=>finish({error: err&&err.code===1?"permission denied":"unavailable"}),
      {enableHighAccuracy:true,timeout:12000,maximumAge:0});
  });
}

/* ---------- selfie ---------- */
function captureSelfie(){
  return new Promise(resolve=>{
    let stream, settled=false;
    const ov=document.createElement("div"); ov.className="camov";
    ov.innerHTML=`<video id="cv" class="mirror" autoplay playsinline muted></video>
      <div class="camtop">Take a selfie at the shop</div>
      <div class="cambar"><button class="cambtn" id="camCancel">Cancel</button>
        <button class="shutter" id="shot" disabled aria-label="Capture"></button><span class="camspacer"></span></div>`;
    document.body.appendChild(ov);
    const finish=v=>{ if(settled)return; settled=true; try{stream&&stream.getTracks().forEach(t=>t.stop());}catch(e){} ov.remove(); resolve(v); };
    ov.querySelector("#camCancel").onclick=()=>finish({cancelled:true});
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ finish({blob:null}); return; }
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"user"}},audio:false}).then(str=>{
      stream=str; const v=ov.querySelector("#cv"); v.srcObject=str; v.play().catch(()=>{});
      const shot=ov.querySelector("#shot"); shot.disabled=false;
      shot.onclick=()=>{ try{
        const w=v.videoWidth||480,h=v.videoHeight||640,sc=Math.min(1,640/Math.max(w,h));
        const cw=Math.round(w*sc),ch=Math.round(h*sc);
        const c=document.createElement("canvas"); c.width=cw; c.height=ch; c.getContext("2d").drawImage(v,0,0,cw,ch);
        c.toBlob(b=>finish({blob:b}),"image/jpeg",0.6);
      }catch(e){ finish({blob:null}); } };
    }).catch(()=>finish({blob:null}));
  });
}

/* ---------- punch (selfie + location -> Supabase) ---------- */
async function startPunch(st,type){
  const ts=Date.now(), pid=uid();
  const rec={id:pid, staffId:st.id, name:st.name, type, ts};
  let photoBlob=null;
  if(S.selfie){
    const r=await captureSelfie();
    if(r.cancelled) return;
    photoBlob=r.blob;
  }
  if(S.verify==="location"){
    const L=await captureLocation();
    if(L.cancelled) return;
    if(L.error){ rec.locError=L.error; }
    else { rec.loc={lat:L.lat,lng:L.lng,acc:L.acc}; if(venueSet()) rec.dist=distM(S.venue.lat,S.venue.lng,L.lat,L.lng); }
  }
  let photo_path=null;
  if(photoBlob){ try{ photo_path=await uploadPhoto(photoBlob); }catch(e){ alert("Couldn't upload your photo — check your connection and try again."); return; } }
  const row={ id:pid, staff_id:st.id, name:st.name, kind:type, ts,
    lat:rec.loc?.lat??null, lng:rec.loc?.lng??null, acc:rec.loc?.acc??null,
    dist:rec.dist??null, on_site:(rec.dist!=null&&venueSet())?(rec.dist<=radius()):null, loc_error:rec.locError??null, photo_path };
  try{ await api("punches",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(row)}); }
  catch(e){ alert("Couldn't save your punch — check your connection and try again."); return; }
  if(photo_path) rec.photoUrl=photoUrlFor(photo_path);
  S.punches.unshift(rec);
  stamp={type,name:st.name,ts}; renderStamp();
  clearTimeout(startPunch._t); startPunch._t=setTimeout(dismissStamp,3500);
}
function dismissStamp(){ stamp=null; clearTimeout(startPunch._t); document.getElementById("stampEl")?.remove(); }

/* ---------- SHEET ---------- */
function renderSheet(){
  document.getElementById("scrim")?.remove();
  if(!sheet) return;
  const s=document.createElement("div"); s.className="scrim"; s.id="scrim";
  s.onclick=e=>{ if(e.target===s){sheet=null; render();} };
  s.innerHTML=`<div class="sheet">${sheetInner()}</div>`;
  document.body.appendChild(s);
}
function sheetInner(){
  if(sheet.kind==="pin"){
    const verb=sheet.next==="in"?"Clock in":"Clock out";
    const dots=[0,1,2,3].map(i=>`<div class="pd ${i<sheet.entry.length?'f':''} ${sheet.err?'err':''}"></div>`).join("");
    const keys=["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k===""?`<div class="key blank"></div>`:`<button class="key" onclick="pinKey('${k}')">${k}</button>`).join("");
    const bits=[]; if(S.selfie) bits.push("a selfie"); if(S.verify==="location") bits.push("your location");
    const note=bits.length?`<div class="sub" style="margin-top:14px;text-align:center">${("We'll capture "+bits.join(" and ")+" when you clock in or out.")}</div>`:"";
    return `<h3>${verb} — ${esc(sheet.staff.name)}</h3><div class="sub">Enter your 4-digit PIN</div><div class="dots">${dots}</div><div class="keys">${keys}</div>${note}`;
  }
  if(sheet.kind==="setmgr") return `<h3>Set a Manager PIN</h3><div class="sub">You'll need this to reach staff settings and reports.</div>
    <div class="field"><input id="mp" type="tel" inputmode="numeric" maxlength="8" placeholder="Choose a PIN"></div>
    <button class="btn primary wide" onclick="saveMgrPin()">Save & continue</button>`;
  if(sheet.kind==="askmgr") return `<h3>Manager PIN</h3><div class="sub">Enter your PIN to continue.</div>
    <div class="field"><input id="mp" type="tel" inputmode="numeric" maxlength="8" placeholder="PIN" ${sheet.err?'style="border-color:var(--danger)"':''}></div>
    <button class="btn primary wide" onclick="checkMgrPin()">Enter</button>`;
  if(sheet.kind==="staff"){ const ed=sheet.edit;
    return `<h3>${ed?'Edit':'Add'} staff</h3>
      <div class="field"><label>Name</label><input id="sn" type="text" value="${ed?esc(ed.name):''}" placeholder="Full name"></div>
      <div class="field"><label>4-digit PIN</label><input id="sp" type="tel" inputmode="numeric" maxlength="4" value="${ed?esc(ed.pin):''}" placeholder="e.g. 1234"></div>
      <div class="rowbtns"><button class="btn primary" onclick="saveStaff()">Save</button>
      <button class="btn ghost" onclick="sheet=null;render()">Cancel</button>
      ${ed?`<button class="btn danger" style="margin-left:auto" onclick="removeStaff('${ed.id}')">Remove</button>`:''}</div>`;
  }
  return "";
}
function pinKey(k){
  if(!sheet||sheet.kind!=="pin") return;
  sheet.err=false;
  if(k==="⌫"){ sheet.entry=sheet.entry.slice(0,-1); render(); return; }
  if(sheet.entry.length>=4) return;
  sheet.entry+=k;
  if(sheet.entry.length===4){
    if(sheet.entry===sheet.staff.pin){ const st=sheet.staff,next=sheet.next; sheet=null; render(); startPunch(st,next); return; }
    sheet.err=true; sheet.entry=""; render(); setTimeout(()=>{ if(sheet){sheet.err=false; render();} },350); return;
  }
  render();
}

/* ---------- STAMP ---------- */
function renderStamp(){
  document.getElementById("stampEl")?.remove();
  const el=document.createElement("div"); el.id="stampEl"; el.className="stamp "+stamp.type; el.onclick=dismissStamp;
  el.innerHTML=`<div class="mark">${stamp.type==="in"?"✓":"✕"}</div>
    <div class="verb">${stamp.type==="in"?"Clocked in":"Clocked out"}</div>
    <div class="who">${esc(stamp.name)}</div><div class="at">${hm(stamp.ts)}</div><div class="tap">Tap to close</div>`;
  document.body.appendChild(el);
}

/* ---------- MANAGER ---------- */
function openManager(){ sheet=S.managerPin?{kind:"askmgr"}:{kind:"setmgr"}; render(); }
async function saveMgrPin(){ const v=(document.getElementById("mp").value||"").trim(); if(v.length<4){alert("Use at least 4 digits.");return;}
  S.managerPin=v; try{await saveSettings();}catch(e){alert("Couldn't save: "+e.message);return;} sheet=null; enterManager(); }
function checkMgrPin(){ const v=(document.getElementById("mp").value||"").trim(); if(v===S.managerPin){sheet=null; enterManager();} else {sheet.err=true; render();} }
function enterManager(){ screen="manager"; render(); refreshManager(); clearInterval(mgrTimer); mgrTimer=setInterval(refreshManager,15000); }
function exitManager(){ clearInterval(mgrTimer); mgrTimer=null; screen="roster"; sheet=null; render(); }
async function refreshManager(){
  try{ const rows=await api("punches?select=*&ts=gte."+(Date.now()-2*864e5)+"&order=ts.desc");
    S.punches=(rows||[]).map(fromRow); if(screen==="manager") render(); }catch(e){}
}

function managerHTML(){ return `<div class="mtop"><h2>Manager</h2><button class="btn ghost sm" onclick="exitManager()">Back to clock</button></div>
  ${onShiftCard()}${todayCard()}${staffCard()}${exportCard()}${settingsCard()}`; }

function proof(p){
  if(!p) return "";
  let parts="";
  if(p.loc){
    let pill = (!venueSet()||p.dist==null) ? `<span class="pill warn">Located</span>`
      : (p.dist<=radius() ? `<span class="pill on">On-site · ${Math.round(p.dist)} m</span>` : `<span class="pill off">Off-site · ${Math.round(p.dist)} m</span>`);
    parts+=`📍${pill}<a class="cap" href="https://www.google.com/maps?q=${p.loc.lat},${p.loc.lng}" target="_blank" rel="noopener">map</a><span class="cap">±${Math.round(p.loc.acc)} m</span>`;
  } else if(p.locError){ parts+=`<span class="pill off">No location</span><span class="cap">${esc(p.locError)}</span>`; }
  if(p.photoUrl){ parts+=`<img class="thumb" src="${p.photoUrl}" onclick="enlarge('${p.photoUrl}')" alt="">`; }
  return parts?`<div class="pblock">${parts}</div>`:"";
}
function enlarge(u){ const o=document.createElement("div"); o.className="scrim"; o.style.alignItems="center"; o.style.padding="24px"; o.style.zIndex=50;
  o.onclick=()=>o.remove(); o.innerHTML=`<img src="${u}" style="max-width:100%;max-height:80vh;border-radius:14px">`; document.body.appendChild(o); }

function onShiftCard(){
  const on=S.staff.filter(st=>{const lp=lastPunch(st.id);return lp&&lp.type==="in";});
  const rows=on.length?on.map(st=>{const lp=lastPunch(st.id);
    return `<tr><td>${esc(st.name)}</td><td class="t">${hm(lp.ts)}${proof(lp)}</td><td class="t">${durTxt(Date.now()-lp.ts)}</td><td><span class="pill on">on shift</span></td></tr>`;}).join("")
    :`<tr><td colspan="4" class="empty-log">No one is clocked in right now.</td></tr>`;
  return `<div class="card"><h4><span>On shift now</span><button class="btn ghost sm" onclick="refreshManager()">Refresh</button></h4>
    <table><thead><tr><th>Name</th><th>Since</th><th>Elapsed</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function todayCard(){
  const today=dayKey(Date.now());
  const ss=buildSessions(S.punches, p=>dayKey(p.ts)===today);
  const rows=ss.length?ss.map(s=>`<tr><td>${esc(s.name)}</td>
      <td class="t">${s.in?hm(s.in):'—'}${proof(s.inP)}</td>
      <td class="t">${s.out?hm(s.out):'—'}${proof(s.outP)}</td>
      <td class="t">${s.out&&s.in?durTxt(s.out-s.in):'<span class="pill on">now</span>'}</td></tr>`).join("")
    :`<tr><td colspan="4" class="empty-log">No clock-ins today yet.</td></tr>`;
  return `<div class="card"><h4>Today's log</h4><table><thead><tr><th>Name</th><th>In</th><th>Out</th><th>Hours</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function staffCard(){
  const rows=[...S.staff].sort((a,b)=>a.order-b.order).map(st=>`<div class="staffrow"><span class="nm">${esc(st.name)}</span><span class="pin">PIN ${esc(st.pin)}</span><button class="btn ghost sm" onclick="editStaff('${st.id}')">Edit</button></div>`).join("");
  return `<div class="card"><h4>Staff & PINs</h4>${rows||'<div class="empty-log">No staff yet.</div>'}<div style="margin-top:12px"><button class="btn sm" onclick="addStaff()">+ Add staff</button></div></div>`;
}
function exportCard(){
  return `<div class="card"><h4>Export</h4>
    <p class="muted" style="margin:0 0 12px">CSV of clock-in sessions with the on-site check for each punch.</p>
    <div class="rowbtns"><button class="btn sm" onclick="exportCSV('today')">Today</button>
      <button class="btn sm" onclick="exportCSV('week')">Last 7 days</button>
      <button class="btn sm" onclick="exportCSV('all')">All records</button></div></div>`;
}
function settingsCard(){
  const vbtn=v=>`<button class="btn sm ${S.verify===v?'primary':''}" onclick="setVerify('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`;
  let method="";
  if(S.verify==="location"){
    method=`<div class="field"><label>Venue location</label>
      ${venueSet()?`<div class="muted" style="margin-bottom:8px">Set: ${S.venue.lat.toFixed(5)}, ${S.venue.lng.toFixed(5)} · allowed radius ${radius()} m</div>`
        :`<div class="muted" style="margin-bottom:8px">Not set — stand at the venue and capture it so off-site punches can be flagged.</div>`}
      <div class="rowbtns"><button class="btn sm" onclick="setVenueHere()">Use my current location</button></div>
      <div class="inline" style="margin-top:10px"><input id="rad" type="tel" inputmode="numeric" value="${radius()}" placeholder="Radius (m)"><button class="btn sm" onclick="saveRadius()">Save radius</button></div></div>`;
  }
  return `<div class="card"><h4>Settings</h4>
    <div class="field"><div class="togglerow"><label style="margin:0">Take a selfie on each clock in/out</label>
      <button class="btn sm" onclick="toggleSelfie()">${S.selfie?'On':'Off'}</button></div></div>
    <div class="field"><label>Verify each clock in/out with</label><div class="rowbtns">${vbtn("location")}${vbtn("off")}</div></div>
    ${method}
    <div class="field"><label>Venue name</label><div class="inline"><input id="vn" type="text" value="${esc(S.venueName)}"><button class="btn sm" onclick="saveVenue()">Save</button></div></div>
    <div class="field"><label>Manager PIN</label><div class="inline"><input id="mpn" type="tel" inputmode="numeric" maxlength="8" value="${esc(S.managerPin)}"><button class="btn sm" onclick="saveMgrPin2()">Update</button></div></div>
    <p class="muted">Records live in your Supabase database; selfies in the punch-photos bucket. Prune old ones from the Supabase dashboard.</p></div>`;
}

/* sessions */
function buildSessions(arr, filter){
  const ps=arr.filter(filter).slice().sort((a,b)=>a.ts-b.ts);
  const open={}, out=[];
  for(const p of ps){
    if(p.type==="in"){ open[p.staffId]={name:p.name,in:p.ts,inP:p}; }
    else { const o=open[p.staffId];
      if(o){ out.push({name:o.name,in:o.in,inP:o.inP,out:p.ts,outP:p}); delete open[p.staffId]; }
      else { out.push({name:p.name,in:null,inP:null,out:p.ts,outP:p}); } }
  }
  for(const k in open){const o=open[k]; out.push({name:o.name,in:o.in,inP:o.inP,out:null,outP:null});}
  return out.sort((a,b)=>(a.in||a.out)-(b.in||b.out));
}

/* staff CRUD */
function addStaff(){ sheet={kind:"staff",edit:null}; render(); }
function editStaff(id){ sheet={kind:"staff",edit:S.staff.find(s=>s.id===id)}; render(); }
async function saveStaff(){
  const name=(document.getElementById("sn").value||"").trim(); const pin=(document.getElementById("sp").value||"").trim();
  if(!name){alert("Enter a name.");return;} if(!/^\d{4}$/.test(pin)){alert("PIN must be 4 digits.");return;}
  let st=sheet.edit;
  if(st){ st.name=name; st.pin=pin; } else { st={id:uid(),name,pin,order:S.staff.length}; S.staff.push(st); }
  const row={id:st.id,name:st.name,pin:st.pin,sort:st.order};
  try{ await api("staff",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)}); }catch(e){ alert("Couldn't save staff: "+e.message); }
  sheet=null; render();
}
async function removeStaff(id){
  if(!confirm("Remove this staff member? Their past records stay in the database.")) return;
  S.staff=S.staff.filter(s=>s.id!==id);
  try{ await api("staff?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}}); }catch(e){ alert("Couldn't remove: "+e.message); }
  sheet=null; render();
}
async function seedSample(){
  const names=["Maria Santos","Jordan Lee","Amir Haddad","Chloe Nguyen"];
  names.forEach((n,i)=>S.staff.push({id:uid(),name:n,pin:String(1111*(i+1)).slice(0,4),order:i}));
  try{ await api("staff",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(S.staff.map(s=>({id:s.id,name:s.name,pin:s.pin,sort:s.order})))}); }catch(e){ alert("Couldn't add: "+e.message); }
  render();
}

/* settings actions */
async function toggleSelfie(){ S.selfie=!S.selfie; try{await saveSettings();}catch(e){alert(e.message);} render(); }
async function setVerify(v){ S.verify=v; try{await saveSettings();}catch(e){alert(e.message);} render(); }
async function setVenueHere(){ const L=await captureLocation(); if(L.cancelled)return; if(L.error){alert("Couldn't get location: "+L.error);return;}
  S.venue.lat=L.lat; S.venue.lng=L.lng; if(S.venue.radius==null)S.venue.radius=150; try{await saveSettings();}catch(e){alert(e.message);} render(); alert("Venue location saved."); }
async function saveRadius(){ const v=parseInt(document.getElementById("rad").value,10); if(!(v>0)){alert("Enter a radius in metres.");return;} S.venue.radius=v; try{await saveSettings();}catch(e){alert(e.message);} render(); }
async function saveVenue(){ S.venueName=(document.getElementById("vn").value||"My Venue").trim()||"My Venue"; try{await saveSettings();}catch(e){alert(e.message);} render(); }
async function saveMgrPin2(){ const v=(document.getElementById("mpn").value||"").trim(); if(v.length<4){alert("Use at least 4 digits.");return;} S.managerPin=v; try{await saveSettings(); alert("Manager PIN updated.");}catch(e){alert(e.message);} }

/* CSV */
function proofText(p){
  if(!p) return "";
  let s="";
  if(p.loc){ let st=!venueSet()||p.dist==null?"located":(p.dist<=radius()?"on-site":"off-site");
    s=st+(p.dist!=null?" "+Math.round(p.dist)+"m":"")+" ("+p.loc.lat.toFixed(5)+","+p.loc.lng.toFixed(5)+")"; }
  else if(p.locError){ s="no location: "+p.locError; }
  if(p.photoUrl) s+=(s?"; ":"")+"selfie";
  return s;
}
async function exportCSV(range){
  let q="punches?select=*&order=ts.asc";
  if(range==="today"){ const t=new Date(); t.setHours(0,0,0,0); q="punches?select=*&ts=gte."+t.getTime()+"&order=ts.asc"; }
  if(range==="week"){ q="punches?select=*&ts=gte."+(Date.now()-7*864e5)+"&order=ts.asc"; }
  let rows; try{ rows=(await api(q)).map(fromRow); }catch(e){ alert("Couldn't fetch records: "+e.message); return; }
  const ss=buildSessions(rows, ()=>true);
  if(!ss.length){ alert("No records in that range."); return; }
  const out=[["Date","Staff","Clock in","Clock out","Hours","In check","Out check"]];
  for(const s of ss){ const base=s.in||s.out;
    out.push([dayKey(base),s.name,s.in?hm(s.in):"",s.out?hm(s.out):"",(s.in&&s.out)?decHours(s.out-s.in):"", proofText(s.inP), proofText(s.outP)]); }
  const csv=out.map(r=>r.map(c=>/[",\n]/.test(c)?'"'+String(c).replace(/"/g,'""')+'"':c).join(",")).join("\r\n");
  const fname=(S.venueName.replace(/[^\w -]/g,"").trim()||"venue")+"-timesheet-"+dayKey(Date.now())+".csv";
  const b=new Blob([csv],{type:"text/csv"}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=fname; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}

setInterval(()=>{ const c=document.getElementById("clk"); if(c) c.innerHTML=clockStr();
  document.querySelectorAll(".dur[data-since]").forEach(el=>{el.textContent=durTxt(Date.now()-Number(el.dataset.since));}); },1000);

init();
</script>
